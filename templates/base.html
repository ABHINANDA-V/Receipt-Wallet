{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %} Receipt Wallet {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

     <!-- Custome CSS -->
      <link rel="stylesheet" href="{% static 'css/style.css' %}">

    
</head>
<body>

    <!-- Navigation Bar -->
     <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">

  <div class="container">

    <!-- Website logo and Name -->
    <a class="navbar-brand fw-bold text-primary d-flex align-items-center" href="/">
      <span class="brand-icon me-2">👛 </span>
      Receipt Wallet
    </a>

    <!-- Mobile Toggle Button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Menu -->
    <div class="collapse navbar-collapse" id="mainNavbar">

      <!-- Navigation Links -->
      <ul class="navbar-nav  mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active fw-semibold"  href="/">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-semibold" href="/#features">Features</a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-semibold" href="/#About">About</a>
        </li>

      </ul>

      <!-- Login and Registration Buttons -->
       <div class="d-flex flex-column flex-lg-row gap-2">
        <a href="#login" class="btn btn-primary px-4">Login</a>

        <a href="#register" class="btn btn-outline-primary px-4">Register</a>
       </div>

      
    </div>
  </div>
</nav>

<!-- Main Content -->
 {% block content %}
 {% endblock %}



 <!-- Footer -->
  <footer class="bg-white border-top mt-5">
        <div class="container py-4">
          <div class="row align-items-center gy-3">

            <div class="col-md-6 text-center text-md-start">
              <h5>
                👛 Receipt Wallet
              </h5>
              <p class="text-muted small mb-0">
                Manage your bills and warranties digitally.
              </p>
            </div>

            <div class="col-md-6 text-center text-md-end">

              <a href="/" class="text-decoration-none text-secondary me-3">Home</a>
              <a href="/#features" class="text-decoration-none text-secondary me-3">Features</a>
              <a href="/#about" class="text-decoration-none text-secondary">About</a>
            </div>


          </div>
          <hr class="my-3">
          <div class="text-center">
            <p class="text-muted small mb-0">
            @2026 Receipt Wallet. All Rights Reserved.</p>
          </div>

        </div>
  </footer>
  
    
<!-- Bootstrap Javascript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>



    <!-- Custome Javascript -->
     <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
