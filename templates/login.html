{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="auth-page">
    <div class="container-fluid">
        <div class="row g-3">
            <div class="col-md-6">
                <img src="{% static 'images/login picture.png' %}" class="auth-picture" alt="loginPicture">
            </div>


            <div class="col-md-6 py-5">
                <div class="card auth-card p-5 ">

                    <div class="text-center mb-4">
                    <h2 class="fw-bold auth-title">Login to Your Account</h2>
                    <p class="text-secondary">Enter your Credentials</p>
                    </div>

                    <!-- LOGIN FORM -->
                    <form action="">
                        
                        <!-- Email -->
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="addon-wrapping"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control py-3" placeholder="Email Address" required>
                        </div>

                        <!-- Password -->
                        <div class="input-group mb-4">
                            <span class="input-group-text" id="addon-wrapping"> <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control py-3" placeholder="Password" required>
                        </div>

                        <div class="text-end mb-4">
                           
                            <a href="/forgot-password" class="text-primary text-decoration-none small fw-semibold">Forgot Password?</a>
                        </div>

                        <div class="input-group mb-4">
                            <button class="btn btn-primary btn-lg w-100">Login</button>
                        </div>


                        
                    </form>

                </div>
            </div>
        </div>
    </div>

</section>
{% endblock %}
