{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="auth-page">
    <div class="container-fluid">
        <div class="row g-3">
            <div class="col-md-6">
                <img src="{% static 'images/register picture.png' %}" class="auth-picture" alt="loginPicture">
            </div>


            <div class="col-md-6 py-5">
                <div class="card auth-card p-5 ">

                    <div class="text-center mb-4">
                    <h2 class="fw-bold auth-title">Create Your Account</h2>
                    <p class="text-secondary">Join Receipt Wallet Today</p>
                    </div>

                    <!-- Register FORM -->
                    <form action="">
                        <!-- Full Name -->
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="addon-wrapping"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control py-3" id="full_name" placeholder="Enter your Full Name" required>
                        </div>
                        

                        <!-- Email -->
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="addon-wrapping"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control py-3" id="email" placeholder="Enter your Email Address" required>
                        </div>

                        <!-- Password -->
                        <div class="input-group mb-4">
                            <span class="input-group-text" id="addon-wrapping"> <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control py-3" id="password" placeholder="Create a Password" required>
                        </div>

                        <!--Confirm  Password -->
                        <div class="input-group mb-4">
                            <span class="input-group-text" id="addon-wrapping"> <i class="bi bi-shield-lock"></i>
                            </span>
                            <input type="password" class="form-control py-3" id="confirm_password" placeholder="Confirm your Password" required>
                        </div>

 

                        <div class="input-group mb-4">
                            <button class="btn btn-primary btn-lg w-100">Register</button>
                        </div>


                        
                    </form>

                    <!-- Login Link -->
                     <div class="text-center mt-4">
                        <p class="text-secondary">Already have an account?
                            <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Login Now</a>
                        </p>

                     </div>

                </div>
            </div>
        </div>
    </div>

</section>
{% endblock %}
